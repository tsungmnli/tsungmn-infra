apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tsungmn-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/tsungmn/tsungmn-config.git
    targetRevision: main
    path: overlays
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
