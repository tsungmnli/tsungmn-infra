# 홈서버 공용 PostgreSQL. travel-planner, skku-notice 등 여러 서비스가 함께 씁니다.
# 서비스마다 DB와 역할(role)을 따로 만들어 씁니다. (각 서비스 infra repo의 db/<서비스>/init.sql)
# ArgoCD 관리 대상이 아닙니다. 홈서버에서 직접 실행합니다. 자세한 내용은 README.md.
name: homeserver-db

services:
  db:
    image: postgres:17
    container_name: homeserver-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER 가 필요합니다}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 가 필요합니다}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB 가 필요합니다}
    volumes:
      - ${PG_DATA_DIR:-./data/pg}:/var/lib/postgresql/data
    ports:
      - "${DB_BIND_IP:?DB_BIND_IP 에 홈서버의 사설 IP 를 지정하세요}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
